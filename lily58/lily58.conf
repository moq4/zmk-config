# Lily58 (keebd wireless kit, Mikoto 7.2 controllers)
#
# Starts from keebd's stock lily58.conf and adds the responsiveness changes
# marked "NEW" below. Your keymap is in lily58.keymap.

# --- From keebd's stock config ---------------------------------------------
# Rotary encoder on the left half
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# nice!view displays
CONFIG_ZMK_DISPLAY=y

# ZMK Studio, so you can keep remapping keys without reflashing
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- NEW: responsiveness ---------------------------------------------------
# Max Bluetooth transmit power (+8 dBm). The stock build uses the default
# (0 dBm). Your Corne already runs with this. A stronger signal means fewer
# dropped packets between the halves, and dropped packets are what make one
# half's keys arrive late and out of order. Costs some battery.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK's "planned default" connection settings: they turn off the 2M radio
# mode, which can give flaky connections on some setups. This matches the
# symptom where a power cycle sometimes "fixes" the board.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Register key presses after 1 ms of contact instead of 5 ms. Releases keep
# the default 5 ms, so worn switches don't double-type.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1

# Not changed: the link between the halves already uses the fastest interval
# ZMK allows (7.5 ms, CONFIG_ZMK_SPLIT_BLE_PREF_INT=6).
